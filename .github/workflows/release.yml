name: release

# Publishes a GitHub release when a plugin tag is pushed (`claude plugin tag --push`),
# with the matching CHANGELOG.md section as notes.
on:
  push:
    tags: ['cc-global-setup--v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME##*--v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "v${GITHUB_REF_NAME##*--v}" --notes-file notes.md
