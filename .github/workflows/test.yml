name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq tmux trash-cli
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq tmux
      - name: Configure git
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Run tests
        run: ./tests/run.sh
